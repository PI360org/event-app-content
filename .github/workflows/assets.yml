{"name":"update-asset","on":{"repository_dispatch":{"types":["asset-update"]}},"permissions":{"contents":"write"},"jobs":{"write":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Write asset","env":{"P":"${{ github.event.client_payload.path }}","B":"${{ github.event.client_payload.b64 }}"},"run":"echo \"$P\" | grep -Eq '^(logos|images)/[a-z0-9]+\\.(svg|png|jpg|webp)$' || exit 1\nmkdir -p \"$(dirname \"$P\")\"\nprintf '%s' \"$B\" | base64 -d > \"$P\"\ngit config user.name pi360-bot\ngit config user.email bot@pi360.org\ngit add \"$P\"\ngit diff --cached --quiet || git commit -m 'Update asset'\ngit pull --rebase\ngit push"}]}}}
