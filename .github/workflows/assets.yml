{"name":"update-asset","on":{"repository_dispatch":{"types":["asset-update"]}},"permissions":{"contents":"write"},"jobs":{"write":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Write asset","env":{"NAME":"${{ github.event.client_payload.name }}","DIR":"${{ github.event.client_payload.dir }}","B":"${{ github.event.client_payload.b64 }}"},"run":"N=\"$NAME\"\nD=\"${DIR:-logos}\"\ncase \"$D\" in logos|images) ;; *) exit 1;; esac\nS=$(printf '%s' \"${N%.*}\" | tr A-Z a-z | tr -cd a-z0-9)\nX=$(printf '%s' \"${N##*.}\" | tr A-Z a-z)\nP=\"$D/$S.$X\"\necho \"$P\" | grep -Eq '^(logos|images)/[a-z0-9]+\\.(svg|png|jpg|webp)$' || exit 1\nmkdir -p \"$D\"\nprintf '%s' \"$B\" | base64 -d > \"$P\"\ngit config user.name pi360-bot\ngit config user.email bot@pi360.org\ngit add \"$P\"\ngit diff --cached --quiet || git commit -m \"Update asset\"\ngit pull --rebase\ngit push"}]}}}
